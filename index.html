<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f13">
  <link rel="manifest" href="manifest.json">
  <title>Español — Spaans Leren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <h1><span class="accent">Español</span></h1>
      <div class="header-right">
        <button class="btn-stats-toggle" id="btnStats" aria-label="Statistieken">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        </button>
        <div class="streak" id="streak">
          <span class="streak-fire">🔥</span>
          <span class="streak-count" id="streakCount">0</span>
        </div>
      </div>
    </div>

    <div class="vacation-bar">
      <div class="vacation-label" id="vacationLabel">186 dagen tot vakantie</div>
      <div class="progress-bar">
        <div class="progress-fill vacation-fill" id="vacationFill"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-chip" id="dailyGoal">
        <span class="stat-icon">📝</span>
        <span id="dailyCount">0</span>/20 vandaag
      </div>
      <div class="stat-chip" id="pronGoal">
        <span class="stat-icon">🎤</span>
        <span id="pronCount">0</span>/<span id="pronTotal">0</span> uitspraak
      </div>
    </div>
  </header>

  <!-- Mode toggles -->
  <div class="mode-bar" id="modeBar">
    <button class="mode-btn active" id="modeFlashcard" data-mode="flashcard">Flashcards</button>
    <button class="mode-btn" id="modeType" data-mode="type">Typen</button>
    <button class="mode-btn" id="modeReverse" data-mode="reverse">NL → ES</button>
    <button class="mode-btn" id="modeCloze" data-mode="cloze">Zinnen</button>
    <button class="mode-btn mic-toggle" id="modeMic" data-mode="mic">🎤 Mic</button>
  </div>

  <!-- Category filter -->
  <div class="category-bar hidden" id="categoryBar"></div>

  <nav class="level-nav" id="levelNav"></nav>

  <main class="main">
    <div class="card-container" id="cardContainer"></div>

    <div class="rating-container hidden" id="ratingContainer">
      <button class="btn-rate hard" id="btnHard">
        <span class="key-hint">←</span> Moeilijk
      </button>
      <button class="btn-rate easy" id="btnEasy">
        Makkelijk <span class="key-hint">→</span>
      </button>
    </div>

    <div class="quiz-container hidden" id="quizContainer">
      <div class="quiz-progress" id="quizProgress"></div>
      <div class="quiz-input-wrap">
        <input type="text" class="quiz-input" id="quizInput" placeholder="Type de vertaling..." autocomplete="off" autocapitalize="off">
        <button class="btn-quiz-submit" id="quizSubmit">Check</button>
      </div>
      <div class="quiz-feedback hidden" id="quizFeedback"></div>
    </div>

    <!-- Type mode input -->
    <div class="type-container hidden" id="typeContainer">
      <div class="quiz-input-wrap">
        <input type="text" class="quiz-input" id="typeInput" placeholder="Type het Spaanse woord..." autocomplete="off" autocapitalize="off">
        <button class="btn-quiz-submit" id="typeSubmit">Check</button>
      </div>
      <div class="quiz-feedback hidden" id="typeFeedback"></div>
    </div>

    <!-- Cloze mode input -->
    <div class="type-container hidden" id="clozeContainer">
      <div class="cloze-sentence" id="clozeSentence"></div>
      <div class="quiz-input-wrap">
        <input type="text" class="quiz-input" id="clozeInput" placeholder="Vul het ontbrekende woord in..." autocomplete="off" autocapitalize="off">
        <button class="btn-quiz-submit" id="clozeSubmit">Check</button>
      </div>
      <div class="quiz-feedback hidden" id="clozeFeedback"></div>
    </div>
  </main>

  <!-- Stats panel (overlay) -->
  <div class="stats-panel hidden" id="statsPanel">
    <div class="stats-panel-inner">
      <div class="stats-panel-header">
        <h2>Statistieken</h2>
        <button class="btn-close-stats" id="btnCloseStats">&times;</button>
      </div>
      <div class="stats-section">
        <h3>Leitner Verdeling</h3>
        <div class="leitner-chart" id="leitnerChart"></div>
      </div>
      <div class="stats-section">
        <h3>Voortgang per Level</h3>
        <div class="level-chart" id="levelChart"></div>
      </div>
      <div class="stats-section">
        <h3>Moeilijkste Categorieën</h3>
        <div class="category-chart" id="categoryChart"></div>
      </div>
      <div class="stats-section">
        <h3>Streak Historie</h3>
        <div class="streak-info" id="streakInfo"></div>
      </div>
      <div class="stats-section">
        <h3>Overzicht</h3>
        <div class="overview-stats" id="overviewStats"></div>
      </div>
    </div>
  </div>

  <footer class="stats-bar" id="statsBar">
    <div class="stat">
      <div class="stat-value" id="statNew">0</div>
      <div class="stat-label">Nieuw</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statLearning">0</div>
      <div class="stat-label">Leren</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statMastered">0</div>
      <div class="stat-label">Beheerst</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Totaal</div>
    </div>
  </footer>

  <div class="keyboard-hints" id="keyHints">
    <span>Spatie = toon</span>
    <span>← moeilijk</span>
    <span>→ makkelijk</span>
    <span>↓ audio</span>
    <span>↑ mic</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
