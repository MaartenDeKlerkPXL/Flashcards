<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Español — Spaans Leren</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1><span>Español</span> — Spaans Leren</h1>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="progress-text" id="progressText"></p>
  </header>

  <div class="card-container" id="cardContainer"></div>

  <div class="rating-container hidden" id="ratingContainer">
    <button class="btn-rate easy" id="btnEasy">Makkelijk</button>
    <button class="btn-rate hard" id="btnHard">Moeilijk</button>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <div class="stat-value" id="statNew">0</div>
      <div class="stat-label">Nieuw</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statHard">0</div>
      <div class="stat-label">Moeilijk</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statMastered">0</div>
      <div class="stat-label">Beheerst</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
